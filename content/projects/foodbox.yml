sections:
  - type: chapter
    heading: Starting point
    text: Food that is still good gets thrown away, while others in the same neighbourhood rely on donations. We wanted a way to share it directly, without an intermediary.

  - type: chapter
    heading: Concept
    text: A food-sharing station in the neighbourhood. The app shows nearby boxes and their contents. Donors place food in a scan compartment; image recognition identifies it and opens the matching compartment. When someone collects it, the donor gets a thank-you.
    image: assets/img/foodbox/fb-flow.jpg
    caption: "Donor flow: scan compartment, recognised donation, overview, notification"

  - type: chapter
    heading: The system
    text: "Box and apps work together. We designed the service around two fictional personas, Luca and Klaus, who stand for typical donors and recipients."
    cards:
      - [The box, "A phone holder with NFC tag, a scan compartment with webcam and light guide, locked doors, and chilled and unchilled compartments."]
      - [Donor app, "Donors offer surplus food, get a thank-you when it is collected and earn points to reach higher levels the more they give."]
      - [Recipient app, "Recipients verify with their food bank ID and get a daily allowance of “Foodies”, the in-app currency for collecting food."]

  - type: chapter
    heading: Prototype
    text: "A working MDF prototype: a photoresistor and light barrier trigger the camera, the model classifies the food, an Arduino with NFC reader and H-bridge unlocks the compartments, and app and box talk to each other in real time."
    image: assets/img/foodbox/fb-dims.jpg
    caption: Prototype with dimensions
    size: half

  - type: chapter
    heading: Outcome
    text: Shown at the HfG exhibition with a product video.
    image: assets/img/foodbox/foodbox-donation.jpg
    caption: A donor places an apple in the Foodbox
    size: half
