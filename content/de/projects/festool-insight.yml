sections:
  - type: chapter
    heading: Kontext
    text: Das Handwerk steht vor dem größten technologischen Umbruch seit der Industrialisierung. In unserem Szenario starten Sensoren 2027 als Nachrüstlösung und sind 2035 fester Bestandteil jedes Werkzeugs. AR-Brillen verbinden Maschinen, Materialien und Handwerker:innen in Echtzeit.

  - type: chapter
    heading: Ausgangslage
    text: Elektrowerkzeuge sind leistungsstark, aber stumm. Sie geben kein Feedback, wenn sie falsch genutzt oder überlastet werden, und Fehler werden erst sichtbar, wenn ein Gerät kaputtgeht. Erfahrung bleibt bei der Person, nicht im System. Gleichzeitig kämpft das Handwerk mit Fachkräftemangel, wachsender Komplexität und Qualitätsdruck.

  - type: question
    text: Was wäre, wenn Werkzeuge verstehen statt nur reagieren?

  - type: chapter
    heading: Sensor-Pack
    text: Der erste Schritt ist Wahrnehmung, nicht Intelligenz. Ein Sensor-Pack zwischen Akku und Werkzeug kombiniert einen Edge-AI-Mikrocontroller, eine IMU, Bluetooth, UWB und Temperatursensorik. Es misst Kräfte, Vibration und Materialzustand, ermöglicht vorausschauende Wartung, Sicherheitswarnungen und dokumentierte Arbeitsqualität und rüstet bestehende Festool-Werkzeuge auf.
    image: assets/img/festool-insight/festool-board.jpg
    caption: Die Sensorplatine zwischen Akku und Werkzeug

  - type: chapter
    heading: AR-Brille
    text: Daten allein verändern nicht, wie Menschen arbeiten; dafür braucht es ein neues Interface. Die Brille nutzt Head-Tracking, eine Kamera und UWB, um Schritt-für-Schritt-Anleitungen und Echtzeit-Feedback ins Sichtfeld zu bringen, mit minimalen Overlays, die nur erscheinen, wenn sie relevant sind.
    image: assets/img/festool-insight/festool-arview.jpg
    caption: "AR-Ansicht beim Trockenbau: Fortschritt der Aufgabe und Empfehlungen"

  - type: chapter
    heading: Erweitertes Handwerk
    text: Technologie als unaufdringlicher Co-Pilot. Vier Prinzipien prägen das System.
    cards:
      - [Sensorik, "Nachrüstlösung 2027, ins Werkzeug integriert bis 2035."]
      - [AR-Design, "Minimale Overlays mit kontextabhängigen Daten, direkt im Arbeitsbereich."]
      - [Edge AI, "Daten werden vor Ort verarbeitet, ohne Cloud-Latenz."]
      - [Handwerker:innen im Loop, "Die Technologie lernt aus der echten Nutzung; der Mensch behält die Kontrolle."]

  - type: chapter
    heading: Plattform
    text: "Eine Plattform bündelt Werkzeug- und Nutzungsdaten für die ganze Baustelle: frühe Fehlererkennung, Diebstahlerkennung über Standortanomalien und Baupläne, die in der AR-Ansicht zu Warnungen werden."
    image: assets/img/festool-insight/festool-platform2.jpg
    caption: "Insight-Plattform: Pläne hochladen, Warnungen pro Baustelle sehen"

  - type: chapter
    heading: Warum es zählt
    text: Ziel ist, Handwerkswissen im Handwerk zu halten, statt es zu ersetzen. Das Szenario zielt auf Effizienzgewinne von mehr als 30 Prozent, gleichbleibende Qualität und AR-gestützte Lernpfade für die nächste Generation von Handwerker:innen.

  - type: chapter
    heading: Ergebnis
    text: Ein Zukunftsszenario in drei Stufen bis 2035, entwickelt mit Festool. Festool baut nicht nur Werkzeuge. Festool baut Verständnis.
    image: assets/img/festool-insight/festool-ar.jpg
    caption: "Festool-Insight-AR-Brille: Dokumentation, Anleitung, Echtzeit-Feedback"
