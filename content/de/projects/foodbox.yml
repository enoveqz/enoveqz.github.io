title: Foodbox
line: Lebensmittel teilen in der Nachbarschaft, geöffnet per Bilderkennung
kind: B.A.-Projekt, Prototyping/Redesign
year: "2022/23"
tags: [IoT, Physical Prototyping, Interaction Design]
question: Wie können überschüssige Lebensmittel Menschen erreichen, die auf Spenden angewiesen sind, fair und direkt in ihrer Nachbarschaft?
