portrait_label: ★ HFG SCHWÄBISCH GMÜND
lead: |
  I grew up in Reutlingen. Before I studied design, I worked in logistics at Bosch and Mercedes-Benz and did internships in mechatronics, agriculture and social care. That mix still shapes how I work: I want to understand how something is built and how it feels for the people who live with it.
  Outside the studio I cast ceramic mugs, do sports and spend time with art. I speak German, Turkish and English.

