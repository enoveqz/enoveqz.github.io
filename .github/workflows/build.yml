# Erzeugt automatisch Projektseiten (p/…), Vorschaubilder (og/…) und die Sitemap,
# sobald Inhalte, Bilder oder das Skript geändert werden.
name: Build pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/img/**'
      - 'scripts/**'
      - 'assets/js/**'
      - 'assets/css/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pillow
      - run: python scripts/build_pages.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p og sitemap.xml robots.txt index.html about.html cv.html project.html impressum.html datenschutz.html
          git diff --cached --quiet || (git commit -m "Build pages from content" && git push)
